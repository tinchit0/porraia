services:
  app:
    image: porraia
    build: .
    container_name: porraia
    ports:
      - "${PORRAIA_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    environment:
      - DATABASE_URL=file:/data/porra.db
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - LOCK_AT=${LOCK_AT}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    restart: unless-stopped
